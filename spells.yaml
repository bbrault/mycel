      **URL de la MR** : {task}
      **Projet** : {mr_project}
      **MR IID** : {mr_iid}

      **Instructions additionnelles** :
      {instructions}

      ## Donnees pre-chargees

      Les donnees ci-dessous ont ete recuperees automatiquement via `glab`. La premiere partie est le `glab mr view`, apres le separateur `---DIFF_SEPARATOR---` se trouve le `glab mr diff`.

      ```
      {pre_run_output}
      ```

      ## Ta mission

      A partir des donnees ci-dessus, produis un JSON structure. Ne lance AUCUNE commande bash — tout est deja la.

      Si les donnees pre-chargees contiennent une erreur (ex: "pre_run error"), indique-le dans le summary et remplis les champs avec des valeurs par defaut.

      Si le diff depasse 50 000 caracteres, tronque-le en gardant les fichiers de code source et en excluant les fichiers generes (lock, dist, vendor, node_modules, etc.).

      Reponds UNIQUEMENT en JSON valide :
