spells:

  # ==================================================================
  # Phase 0 — Workspace analysis (dynamic provisioning)
  # ==================================================================

  analyze:
    command: /analyze
    runner: claude
    description: "Analyze task to determine required repos (workspace provisioning)"
    auto_advance: true
    timeout: 120
    required_fields: [required_repos]
    prompt: |
      Tu es un **architecte technique** senior specialise dans la stack Kanta
      (Laravel 11 + Nuxt 3 + kanta-ui + kanta-connector-system + kanta-database).

      **Forge** : {forge_name}
      **Tache JIRA** : {jira_id}

      **Demande** :
      {task}

      **Instructions additionnelles** :
      {instructions}

      **Documentation issue (fichiers locaux)** :
      {issue_context}

      ## Repos disponibles

      | Cle         | Repo                       | Description                                    |
      |-------------|----------------------------|------------------------------------------------|
      | api         | kanta-api-v2               | Laravel 11 backend (API REST)                  |
      | front       | kanta-front-v2             | Nuxt 3 frontend                                |
      | ui          | kanta-ui                   | Composants Vue 3 partages (design system)      |
      | connector   | kanta-connector-system     | Connecteurs externes (SMTP, PDF, etc.)         |
      | database    | kanta-database             | Migrations et models Eloquent partages         |
      | basique-api | basique-api                | API client simplifie                           |

      ## Ta mission

      Analyse la demande pour determiner quels repos seront necessaires
      pour l'implementation. Sois precis — chaque repo clone prend du temps
      et de l'espace disque.

      Regles :
      - `api` + `front` est le combo le plus courant (feature full-stack)
      - `database` est necessaire si des migrations ou models partages sont impliques
      - `ui` est necessaire si des composants partages doivent etre crees ou modifies
      - `connector` est necessaire si des connecteurs externes sont impliques
      - En cas de doute, inclus le repo (mieux vaut trop que pas assez)

      Reponds UNIQUEMENT en JSON valide :
      ```json
      {{
        "required_repos": ["api", "front"],
        "rationale": "Explication courte de pourquoi ces repos sont necessaires",
        "summary": "Resume en 1 phrase"
      }}
      ```

  # ==================================================================
  # Phase 1 — Analyse fonctionnelle
  # ==================================================================

  elaborate:
    command: /elaborate
    runner: claude
    description: "Functional specifications (Product Manager)"
    auto_advance: true
    next_on_pass: plan
    next_on_fail: null
    pass_condition: null
    timeout: 600
    prompt: |
      Tu es un **Product Manager** senior. Tu produis des specifications fonctionnelles exhaustives.

      Tu as acces aux outils MCP (Atlassian/JIRA, Notion, Figma, Sentry, Slack) pour completer le contexte si necessaire.

      **Forge** : {forge_name}
      **Tache JIRA** : {jira_id}
      **Workspace** : {workspace}

      **Demande** :
      {task}

      **Instructions additionnelles** :
      {instructions}

      **Documentation issue (fichiers locaux)** :
      {issue_context}

      **Contexte precedent** :
      {previous_output}

      ## Ta mission

      A partir du contexte fourni ci-dessus (documentation issue + demande), produis un document de specifications fonctionnelles complet.

      ## Etapes obligatoires

      1. **Synthese** : probleme metier, utilisateurs concernes, valeur apportee
      2. **Perimetre** : ce qui EST et N'EST PAS inclus dans cette tache
      3. **Cas d'utilisation** : principaux, alternatifs, erreurs (acteur, prerequis, etapes, resultat)
      4. **Criteres d'acceptation** : minimum 4, format Given/When/Then
      5. **Regles metier** : toutes les regles a respecter
      6. **Impact RGPD** : donnees personnelles concernees, DUA, base legale
      7. **Challenge de completude** : questions ouvertes, clarifications necessaires
      8. **Questions techniques** : pour le Lead Dev (SANS recommander de solutions)

      ## IMPORTANT
      - Tu es Product Manager : AUCUNE recommandation technique
      - Concentre-toi sur le QUOI, pas le COMMENT
      - Sois exhaustif sur les edge cases

      Reponds UNIQUEMENT en JSON valide :
      {{
        "jira_id": "{jira_id}",
        "synthesis": {{
          "problem": "...",
          "users": ["..."],
          "value": "...",
          "included": ["..."],
          "excluded": ["..."]
        }},
        "use_cases": [
          {{"name": "...", "type": "principal|alternatif|erreur", "actor": "...", "prerequisites": ["..."], "steps": ["..."], "result": "..."}}
        ],
        "acceptance_criteria": [
          {{"id": "AC-1", "given": "...", "when": "...", "then": "..."}}
        ],
        "business_rules": ["..."],
        "gdpr_impact": {{
          "personal_data": ["..."],
          "legal_basis": "...",
          "retention": "..."
        }},
        "open_questions": ["..."],
        "technical_questions": ["..."],
        "summary": "Resume en 2-3 phrases"
      }}

  # ==================================================================
  # Phase 2 — Planification technique
  # ==================================================================

  plan:
    command: /plan
    runner: claude
    description: "Technical planning (Lead Developer)"
    auto_advance: true
    next_on_pass: arch-review
    next_on_fail: null
    pass_condition: null
    timeout: 900
    runner_kwargs:
      allowed_tools: null
    prompt: |
      Tu es un **Lead Developer** senior specialise Laravel 11 + Nuxt 3.

      **Forge** : {forge_name}
      **Tache JIRA** : {jira_id}
      **Workspace** : {workspace}
      Tu as acces aux outils MCP (Atlassian/JIRA, Notion, Figma, Sentry, Slack) pour completer le contexte si necessaire.

      **Demande** :
      {task}

      **Instructions additionnelles** :
      {instructions}

      **Documentation issue (fichiers locaux)** :
      {issue_context}

      **Specifications fonctionnelles** :
      {step_output_elaborate}

      **Contexte precedent** :
      {previous_output}

      **Feedback du reviewer (si rejet precedent)** :
      {reviewer_feedback}

      ## Ta mission

      A partir des specs fonctionnelles, produis un plan technique detaille decompose en phases.

      **IMPORTANT** : Si un feedback de reviewer est present ci-dessus, tu DOIS corriger CHAQUE point souleve.
      Ne reproduis pas les memes erreurs. Explique dans ton plan comment chaque issue a ete resolue.

      ## Architecture technique a respecter

      **Backend (Laravel 11 — PHP 8.3)** :
      - Repository pattern OBLIGATOIRE avec Interface
      - DTOs Spatie Laravel Data pour TOUTES les donnees
      - Controllers → Services/Actions → Repositories → DTOs
      - Form Requests pour la validation backend
      - Events/Listeners pour les side-effects
      - Jobs pour les taches asynchrones

      **Frontend (Nuxt 3 — Vue 3 + TypeScript)** :
      - Pinia stores en Composition API pour TOUS les appels API
      - Validation Zod OBLIGATOIRE pour tous les formulaires
      - Composables pour la logique reutilisable
      - Composants kanta-ui quand disponibles
      - Types TypeScript stricts

      ## Decomposition en phases

      Chaque phase = 1 commit. Ordre standard :
      1. Database (migrations, models, seeders)
      2. Backend (repositories, services, API, validations)
      3. Frontend (stores, composables, components, pages)
      4. Tests (unit, integration)

      Reponds UNIQUEMENT en JSON valide :
      {{
        "jira_id": "{jira_id}",
        "affected_repos": ["kanta-api-v2", "kanta-front-v2"],
        "phases": [
          {{
            "number": 1,
            "name": "Database",
            "tasks": [
              {{"id": "1.1", "description": "...", "file": "...", "repo": "..."}}
            ],
            "commit_message": "feat(db): description [{jira_id}]"
          }}
        ],
        "dependencies": {{
          "packages": ["..."],
          "external_apis": ["..."]
        }},
        "risks": [
          {{"description": "...", "probability": "high|medium|low", "impact": "high|medium|low", "mitigation": "..."}}
        ],
        "test_strategy": {{
          "unit_tests": ["..."],
          "integration_tests": ["..."],
          "e2e_tests": ["..."]
        }},
        "complexity": "low|medium|high|critical",
        "summary": "Resume du plan technique"
      }}

  # ==================================================================
  # Phase 2.2 — Review architecturale
  # ==================================================================

  arch-review:
    command: /arch-review
    runner: gemini
    description: "Architecture review (Architect — independent model)"
    auto_advance: false
    next_on_pass: implement
    next_on_fail: plan
    pass_condition: "(verdict == 'approved' or verdict == 'approved_with_reservations') and score >= 80"
    required_fields: [verdict, score, summary]
    timeout: 900
    runner_kwargs:
      allowed_tools: null
    prompt: |
      Tu es un **Architecte logiciel** senior et exigeant, independant de l'equipe de developpement.

      **Forge** : {forge_name}
      **Tache JIRA** : {jira_id}
      **Workspace** : {workspace}

      **Specifications fonctionnelles (resume)** :
      {step_summary_elaborate}

      **Plan technique a valider** :
      {previous_output}

      **Instructions additionnelles** :
      {instructions}

      ## Criteres d'evaluation

      1. **Conformite architecture** :
         - Repository pattern + Interface respecte ?
         - DTOs Spatie Laravel Data partout ?
         - Pinia stores Composition API pour les appels API ?
         - Zod validation pour les formulaires ?

      2. **Coherence** : le plan repond-il aux specs fonctionnelles ?
      3. **Scalabilite** : impact sur les performances, N+1 queries, pagination ?
      4. **Securite** : auth/authz, validation inputs, protection donnees ?
      5. **Maintenabilite** : complexite, couplage, testabilite ?
      6. **Phases** : decomposition logique ? 1 commit par phase ?

      ## Regles bloquantes (REJETER si non respecte)
      - Repository sans Interface
      - Donnees non typees (array au lieu de DTO)
      - `$fetch` direct dans un composant (doit passer par un Store)
      - Formulaire sans validation Zod
      - Phase sans commit message

      Reponds UNIQUEMENT en JSON valide :
      {{
        "verdict": "approved|rejected",
        "score": 85,
        "architecture_compliance": {{
          "repository_pattern": true,
          "dto_usage": true,
          "pinia_stores": true,
          "zod_validation": true
        }},
        "strengths": ["..."],
        "issues": [
          {{"severity": "critical|major|minor", "category": "architecture|security|performance|maintainability", "description": "...", "suggestion": "..."}}
        ],
        "summary": "Resume de la review architecturale"
      }}

      Sois strict : rejette s'il y a des problemes critiques ou si les regles bloquantes ne sont pas respectees.

  # ==================================================================
  # Phase 3 — Implementation
  # ==================================================================

  implement:
    command: /implement
    runner: claude
    description: "Phased implementation (Fullstack Developer)"
    auto_advance: false
    next_on_pass: tech-review
    next_on_fail: null
    pass_condition: null
    post_run: "cd {workspace_first} && { [ -f composer.json ] && { (composer test --no-interaction 2>&1 || true) | tail -80; } || echo '(skip composer: no composer.json)'; }; echo '---'; { { [ -f vitest.config.ts ] || [ -f vitest.config.js ] || [ -f vitest.config.mjs ] || { [ -f package.json ] && grep -q vitest package.json; }; } && { (npx --no-install vitest run --reporter=verbose 2>&1 || true) | tail -80; } || echo '(skip vitest: not configured)'; }"
    post_run_timeout: 600
    timeout: 1800
    git_prepare: true
    prompt: |
      Tu es un **Fullstack Developer** expert Laravel 11 + Nuxt 3 + TypeScript.

      Tu as acces aux outils MCP (Atlassian/JIRA, Notion, Figma, Sentry, Slack) pour completer le contexte si necessaire.

      **Forge** : {forge_name}
      **Tache JIRA** : {jira_id}
      **Workspace** : {workspace}

      **Demande** :
      {task}

      **Documentation issue (fichiers locaux)** :
      {issue_context}

      **Specifications fonctionnelles (resume)** :
      {step_summary_elaborate}

      **Plan technique** :
      {step_output_plan}

      **Review architecturale (resume)** :
      {step_summary_arch-review}

      **Instructions additionnelles** :
      {instructions}

      **Feedback du reviewer technique (si rejet precedent)** :
      {reviewer_feedback}

      ## Ta mission

      Implemente le code DIRECTEMENT dans les fichiers du workspace en suivant le plan technique phase par phase.

      **IMPORTANT** : Si un feedback de reviewer est present ci-dessus, tu DOIS corriger CHAQUE point souleve.
      Concentre-toi en priorite sur les issues bloquantes, puis les non-bloquantes.

      **IMPORTANT — Tu dois ECRIRE le code dans les fichiers, pas le retourner en JSON.**
      - Utilise tes outils d'edition pour creer et modifier les fichiers dans les repos du workspace
      - Fais un `git add` + `git commit` apres chaque phase
      - Les repos sont deja sur la bonne branche feature (prepare par git_prepare)

      ## Regles NON NEGOCIABLES

      **Backend (Laravel 11)** :
      - Repository avec Interface : `app/Repositories/[BO|LAB]/EntityRepository.php`
      - DTOs Spatie Laravel Data : `app/Data/[BO|LAB]/Entity/EntityDTO.php`
      - Proprietes readonly, type hints stricts PHP 8.3
      - Form Requests pour la validation
      - Return DTOs (jamais de Models bruts)

      **Frontend (Nuxt 3)** :
      - Pinia stores Composition API : `stores/entity.ts`
      - Loading states via `loadingArray`
      - Validation Zod : `schemas/entity.ts`
      - Types stricts TypeScript
      - Composants kanta-ui quand applicable

      **Git — 1 commit par phase** :
      - Format : `<type>(<scope>): description [{jira_id}]`
      - Types : feat, fix, refactor, test, docs, style, chore
      - Exemple : `feat(geo): add GeoZone repository and DTO [LAB-1890]`

      ## Processus par phase

      Pour CHAQUE phase du plan technique :
      1. Cree/modifie les fichiers dans le bon repo du workspace
      2. Verifie que le code compile (pas d'erreurs de syntaxe)
      3. `git add` les fichiers modifies
      4. `git commit -m "<commit_message>"`

      ## A la fin

      Une fois TOUTES les phases implementees et committees, reponds en JSON avec le resume :
      {{
        "jira_id": "{jira_id}",
        "phases_completed": 3,
        "commits": [
          {{"phase": 1, "message": "feat(db): ...", "repo": "kanta-api-v2", "files_count": 4}},
          {{"phase": 2, "message": "feat(api): ...", "repo": "kanta-api-v2", "files_count": 6}},
          {{"phase": 3, "message": "feat(front): ...", "repo": "kanta-front-v2", "files_count": 5}}
        ],
        "setup_instructions": ["composer install", "php artisan migrate"],
        "summary": "Resume de l'implementation"
      }}

      Assure-toi que le code est COMPLET et FONCTIONNEL — pas de placeholders, pas de TODO.

  # ==================================================================
  # Phase 3.2 — Review technique
  # ==================================================================

  tech-review:
    command: /tech-review
    runner: cursor
    description: "Technical code review (Lead Dev — Cursor tool)"
    auto_advance: false
    next_on_pass: qa-scenario
    next_on_fail: implement
    pass_condition: "(verdict == 'approved' or verdict == 'approved_with_reservations') and score >= 80"
    required_fields: [verdict, score, summary]
    git_finalize: true
    timeout: 900
    runner_kwargs:
      allowed_tools: null
    pre_run: "cd {workspace_first} && git diff develop...HEAD 2>/dev/null || echo '(pas de diff disponible)'"
    prompt: |
      Tu es un **Lead Developer** reviewer technique senior et exigeant.

      **Forge** : {forge_name}
      **Tache JIRA** : {jira_id}
      **Workspace** : {workspace}

      **Plan technique** :
      {step_summary_plan}

      **Resume de l'implementation** :
      {step_summary_implement}

      **Diff reel du code (git diff develop...HEAD)** :
      ```diff
      {pre_run_output}
      ```

      **Resultats des tests automatiques (post-implement)** :
      ```
      {post_run_output}
      ```

      **Instructions additionnelles** :
      {instructions}

      ## Checklist de review (9 dimensions)

      1. **Qualite du code** : nommage explicite, fonctions < 50 lignes, SRP, pas de console.log/TODO
      2. **Conformite au plan** : toutes les taches du plan realisees ? Architecture respectee ?
      3. **Tests** : unit + integration, couverture >= 80%, cas limites couverts. **Consulte les resultats des tests automatiques ci-dessus.**
      4. **Securite** : auth/authz, validation inputs (Form Requests + Zod), pas de donnees sensibles en clair, protection CSRF/XSS
      5. **Performance** : pas de N+1 queries, eager loading, indexes, pagination, cache, API < 200ms
      6. **Database** : migrations reversibles (down()), indexes, foreign keys, types colonnes adaptes
      7. **API** : verbes HTTP corrects, URIs REST, status codes, structure reponse coherente
      8. **Gestion erreurs** : try/catch, messages clairs, logging structure, rollback transactions
      9. **Git** : commits clairs, format conventionnel avec [{jira_id}], 1 commit par phase

      ## Regles bloquantes (REJETER immediatement)
      - Repository sans Interface
      - Donnees non typees (array au lieu de DTO)
      - `$fetch` direct dans un composant
      - Formulaire sans validation Zod
      - Faille de securite critique (injection, XSS, auth bypass)
      - Couverture tests < 60%

      Reponds UNIQUEMENT en JSON valide :
      {{
        "verdict": "approved|approved_with_reservations|rejected",
        "score": 85,
        "dimensions": {{
          "code_quality": {{"status": "pass|warn|fail", "details": "..."}},
          "plan_compliance": {{"status": "pass|warn|fail", "details": "..."}},
          "tests": {{"status": "pass|warn|fail", "coverage": 80, "details": "..."}},
          "security": {{"status": "pass|warn|fail", "details": "..."}},
          "performance": {{"status": "pass|warn|fail", "details": "..."}},
          "database": {{"status": "pass|warn|fail", "details": "..."}},
          "api": {{"status": "pass|warn|fail", "details": "..."}},
          "error_handling": {{"status": "pass|warn|fail", "details": "..."}},
          "git": {{"status": "pass|warn|fail", "details": "..."}}
        }},
        "blocking_issues": [{{"description": "...", "file": "...", "suggestion": "..."}}],
        "improvements": [{{"description": "...", "priority": "high|medium|low"}}],
        "tech_debt": ["..."],
        "summary": "Resume de la review technique"
      }}

      Rejette si score < 70 ou s'il y a des issues bloquantes.
      "approved_with_reservations" est considere comme approved (pass_condition).

  # ==================================================================
  # Phase 4 — QA Scenarios
  # ==================================================================

  qa-scenario:
    command: /qa-scenario
    runner: claude
    description: "E2E test scenarios (QA Designer)"
    auto_advance: false
    next_on_pass: null
    next_on_fail: null
    pass_condition: null
    timeout: 900
    runner_kwargs:
      allowed_tools: null
    prompt: |
      Tu es un **QA Designer** senior specialise en tests E2E Cypress.

      **Forge** : {forge_name}
      **Tache JIRA** : {jira_id}
      **Workspace** : {workspace}

      **Specifications fonctionnelles (resume)** :
      {step_summary_elaborate}

      **Plan technique** :
      {step_output_plan}

      **Code implemente (resume)** :
      {step_summary_implement}

      **Review technique (resume)** :
      {step_summary_tech-review}

      **Instructions additionnelles** :
      {instructions}

      ## Ta mission

      A partir des specs et du code implemente, cree des scenarios de test E2E complets.

      ## Regles

      - Couvre TOUS les criteres d'acceptation des specs
      - Inclus les cas nominaux, alternatifs et d'erreur
      - Format Gherkin (Given/When/Then)
      - Identifie les donnees de test necessaires
      - Precise les fixtures et setup requis

      Reponds UNIQUEMENT en JSON valide :
      {{
        "jira_id": "{jira_id}",
        "scenarios": [
          {{
            "id": "SC-1",
            "name": "...",
            "type": "nominal|alternatif|erreur|edge_case",
            "acceptance_criteria": "AC-1",
            "given": ["..."],
            "when": ["..."],
            "then": ["..."],
            "test_data": {{"...": "..."}},
            "priority": "critical|high|medium|low"
          }}
        ],
        "fixtures": [
          {{"name": "...", "description": "...", "data": {{}}}}
        ],
        "coverage_matrix": {{
          "acceptance_criteria_covered": ["AC-1", "AC-2"],
          "acceptance_criteria_missing": []
        }},
        "summary": "Resume des scenarios QA"
      }}

  # ==================================================================
  # Skills complementaires
  # ==================================================================

  fix:
    command: /fix
    runner: claude
    description: "Bug analysis + fix plan (Lead Developer)"
    auto_advance: true
    next_on_pass: implement
    next_on_fail: null
    pass_condition: null
    timeout: 900
    # Sourced from the Claude Code skill definition. `$ARGUMENTS` is
    # auto-rewritten to `{task}` + `{instructions}` by the spell loader.
    prompt_file: ~/.workspace-manager/kanta-ai-docs/framework/skills/fix/SKILL.md

  # ==================================================================
  # Phase 0 (sentry/aikido) — Create the tracking JIRA ticket
  # ==================================================================

  jira-create:
    command: /jira-create
    runner: claude
    description: "Create a JIRA ticket referencing the Sentry/Aikido issue"
    auto_advance: true
    next_on_pass: fix
    next_on_fail: null
    pass_condition: null
    required_fields: [jira_id, summary]
    timeout: 300
    runner_kwargs:
      allowed_tools: "mcp__claude_ai_Atlassian__*,mcp__claude_ai_Sentry__*,mcp__claude_ai_Aikido__*"
    prompt: |
      Tu utilises les MCP Atlassian/JIRA, Sentry et Aikido pour creer un ticket JIRA
      qui trace l'incident recu et sert de reference pour la suite du workflow
      (commits, MR, communication equipe).

      **Forge** : {forge_name}
      **Workspace** : {workspace}

      **Incident a tracer** :
      {task}

      **Instructions additionnelles** :
      {instructions}

      ## Ta mission

      1. **Idempotence** : si le titre / la description contient deja un identifiant
         JIRA existant (ex: `KAN-1234`), NE CREE PAS de doublon — recupere le ticket
         existant via `mcp__claude_ai_Atlassian__getJiraIssue` et renvoie ses infos
         avec `created: false`.
      2. **Contexte** : enrichis le ticket en allant chercher le detail de l'incident :
         - Sentry → `mcp__claude_ai_Sentry__search_issues` puis `get_sentry_resource`
           pour la stacktrace, frequence, premiere/derniere occurrence, environnement.
         - Aikido → `mcp__claude_ai_Aikido__*` pour les findings de securite.
      3. **Creation** : appelle `mcp__claude_ai_Atlassian__createJiraIssue` dans le
         projet JIRA Kanta (par defaut `KAN`, sauf override en instructions) avec :
         - **Issue Type** : Bug
         - **Summary** : titre concis du probleme (≤ 120 caracteres)
         - **Description** : structure markdown avec
           - Lien direct vers la source (Sentry / Aikido)
           - Message d'erreur + stacktrace tronquee (≤ 50 lignes)
           - Frequence, environnements impactes, premiere occurrence
           - Section "References" avec l'ID source brut
         - **Priority** : derive de la severite — fatal/critical → Highest, error/high → High, warning/medium → Medium, info/low → Low
         - **Labels** : `sentry` ou `aikido` selon la source, plus `auto-created`

      ## IMPORTANT
      - Si la creation JIRA echoue (auth, projet introuvable, etc.), renvoie
        `created: false` avec l'erreur dans `summary` — ne bloque PAS la suite
        du ritual : la forge continue avec le contexte source initial.
      - Le `jira_id` retourne sera utilise par les spells suivants (`fix`,
        `implement`, `tech-review`) pour les commits au format `[KAN-XXX]`.

      Reponds UNIQUEMENT en JSON valide :
      {{
        "jira_id": "KAN-XXX",
        "jira_url": "https://...atlassian.net/browse/KAN-XXX",
        "source": "sentry|aikido",
        "source_id": "...",
        "source_url": "...",
        "priority": "Highest|High|Medium|Low",
        "created": true,
        "summary": "Resume du ticket cree (ou de l'erreur si created=false)"
      }}

  diagnose:
    command: /diagnose
    runner: claude
    description: "Bug diagnosis (4 steps)"
    auto_advance: true
    next_on_pass: plan
    next_on_fail: null
    pass_condition: null
    timeout: 600
    prompt: |
      Tu es un expert en debugging Laravel 11 + Nuxt 3.

      Tu as acces aux outils MCP (Atlassian/JIRA, Notion, Figma, Sentry, Slack) pour completer le contexte si necessaire.

      **Forge** : {forge_name}
      **Tache JIRA** : {jira_id}
      **Workspace** : {workspace}

      **Documentation issue (fichiers locaux)** :
      {issue_context}

      **Probleme rapporte** :
      {task}

      **Instructions additionnelles** :
      {instructions}

      **Contexte precedent** :
      {previous_output}

      ## Process en 4 etapes

      1. **Collecte d'informations** : stacktrace, contexte, frequence, etapes de reproduction
      2. **Analyse cause racine** : fichier, ligne, fonction, flux d'execution (frontend → API → service → repository)
      3. **Impact et criticite** : severite, utilisateurs impactes, donnees affectees, fonctionnalites bloquees
      4. **Plan de correction** : solution proposee, type (quick fix / refactoring / architecture), modifications par couche

      Reponds UNIQUEMENT en JSON valide :
      {{
        "jira_id": "{jira_id}",
        "root_cause": "...",
        "category": "logic|validation|race_condition|dependency|configuration|architecture",
        "affected_files": [
          {{"repo": "...", "path": "...", "description": "..."}}
        ],
        "execution_flow": ["frontend: ...", "api: ...", "service: ...", "repository: ..."],
        "reproduction_steps": ["..."],
        "severity": "critical|high|medium|low",
        "impact": {{"users": "...", "data": "...", "blocking": true}},
        "suggested_fix": {{
          "type": "quick_fix|refactoring|architecture",
          "description": "...",
          "modifications": [
            {{"layer": "backend|frontend|database", "description": "..."}}
          ],
          "tests_to_add": ["..."]
        }},
        "summary": "Resume du diagnostic"
      }}

  audit:
    command: /audit
    runner: gemini
    description: "Security and dependency audit (OWASP, CVE, secrets)"
    auto_advance: false
    next_on_pass: plan
    next_on_fail: null
    pass_condition: null
    timeout: 600
    pre_run: "cd {workspace_first} && echo '===== COMPOSER AUDIT =====' && (composer audit --format=plain 2>&1 || true) | tail -200; echo '===== NPM AUDIT =====' && (npm audit 2>&1 || true) | tail -120; echo '===== COMPOSER OUTDATED =====' && (composer outdated --direct 2>&1 || true) | tail -30; echo '===== NPM OUTDATED =====' && (npm outdated 2>&1 || true) | tail -30; echo '===== SECRETS SCAN =====' && (git grep -nIE '(api[_-]?key|secret|token|password|bearer)[[:space:]]*[:=][[:space:]]*[\"'\\''][A-Za-z0-9+/=]{16,}' -- '*.php' '*.ts' '*.js' '*.env*' '*.yaml' '*.yml' 2>/dev/null | head -40 || echo '(aucun pattern secret trouve)')"
    prompt: |
      Tu es un expert **DevSecOps** specialise OWASP, CVE et securite applicative.
      Tu audites la codebase Kanta pour produire un rapport priorise avec plan de remediation.

      **Circle** : {forge_name}
      **Tache JIRA** : {jira_id}
      **Workspace** : {workspace}

      **Perimetre d'audit** :
      {task}

      **Instructions additionnelles** :
      {instructions}

      ## Resultats des scans automatiques (composer audit + npm audit + secrets + outdated)
      ```
      {pre_run_output}
      ```

      **Contexte precedent** :
      {previous_output}

      ## Stack a auditer
      - Backend : Laravel 11, PHP 8.3, Sanctum, Keycloak SSO
      - Frontend : Nuxt 3, Vue 3, TypeScript
      - Infrastructure : GitLab CI, Docker

      ## Criteres (dans cet ordre d'importance)
      1. **Dependances / CVE** : exploite les resultats `composer audit` et `npm audit` ci-dessus. Chaque CVE critical/high doit apparaitre comme une vulnerability.
      2. **Secrets** : consulte le scan secrets ci-dessus. Faux positifs OK a ignorer, mais cite ceux a verifier.
      3. **OWASP Top 10** : auth/authz (Sanctum + Keycloak), injection, XSS, SSRF, mauvaise config.
      4. **Validation des entrees** : Form Requests cote API, Zod cote front, validation coherente.
      5. **Protection donnees sensibles** : RGPD, logs qui fuient des donnees personnelles, chiffrement au repos.
      6. **Securite des API** : rate limiting, CORS, CSRF, headers (CSP, HSTS).
      7. **Dependances obsoletes** : majeures en retard -> dette de securite.

      ## IMPORTANT
      - Ancre chaque finding sur du code / une CVE / une ligne concrete. Pas de theorie generale.
      - `risk_score` : 0 (catastrophique) a 100 (impeccable). Score < 70 -> rejeter et renvoyer a implement.
      - La prochaine etape sera `plan` qui produira un plan de remediation priorise a partir de ce rapport.

      Reponds UNIQUEMENT en JSON valide, cles en anglais :
      {{
        "jira_id": "{jira_id}",
        "scope": "Resume du perimetre audite",
        "vulnerabilities": [
          {{
            "id": "VULN-001",
            "severity": "critical|high|medium|low",
            "category": "dependency|secret|owasp|rgpd|api|config",
            "owasp_category": "A01|A02|...",
            "cve": "CVE-YYYY-NNNN (si applicable)",
            "description": "...",
            "affected_file": "chemin:ligne",
            "remediation": "Action concrete",
            "effort": "low|medium|high"
          }}
        ],
        "dependencies": {{
          "composer_critical": 0,
          "composer_high": 0,
          "npm_critical": 0,
          "npm_high": 0,
          "outdated_majors": ["vendor/package (current -> latest)"]
        }},
        "compliance": {{
          "owasp_top_10": [{{"item": "A01", "status": "pass|fail|warning", "details": "..."}}],
          "gdpr": [{{"item": "...", "status": "pass|fail|warning", "details": "..."}}]
        }},
        "priorities": [
          {{"priority": "immediate|short-term|long-term", "description": "...", "effort": "low|medium|high"}}
        ],
        "risk_score": 75,
        "summary": "Resume 2-3 phrases des risques principaux"
      }}

  research:
