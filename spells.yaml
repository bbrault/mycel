  review-mr:
    command: /review-mr
    runner: claude
    description: "Comprehensive MR review — architecture, patterns, code quality, security, tests (project skill)"
    auto_advance: true
    next_on_pass: null
    next_on_fail: null
    pass_condition: null
    timeout: 900
    runner_kwargs:
      allowed_tools: null
    # Sourced from the project Claude Code skill (~/.workspace-manager/...).
    # `$ARGUMENTS` is auto-rewritten to `{task}` + `{instructions}` by the spell loader.
    prompt_file: ~/.workspace-manager/kanta-ai-docs/framework/skills/review-mr/SKILL.md

  mr-review:
    command: /mr-review
    runner: claude
    description: "MR code review (bugs, security, breaking changes, tests)"
    auto_advance: true
    next_on_pass: mr-review-arch
    next_on_fail: null
    pass_condition: null
    required_fields: [verdict, score, findings, summary]
    timeout: 600
    runner_kwargs:
      allowed_tools: null
    prompt: |
      Tu es un **Lead Developer** reviewer senior specialise dans la review de code.

      **Forge** : {forge_name}

      **Instructions additionnelles** :
      {instructions}

      **Donnees de la MR** :
      {step_output_mr-fetch}

      ## Ta mission

      Effectue une review de code approfondie du diff de cette Merge Request.

      ## Dimensions d'analyse

      ### 1. Bugs et edge cases
      | Categorie | Points de controle |
      |-----------|-------------------|
      | **Erreurs logiques** | Conditions inversees, off-by-one, comparaisons incorrectes, court-circuits manquants |
      | **Edge cases** | Valeurs null/undefined, tableaux vides, chaines vides, valeurs limites (0, -1, MAX_INT) |
      | **Race conditions** | Acces concurrents, etat partage mutable, operations non-atomiques |
      | **Gestion d'erreurs** | Try/catch manquants, erreurs silencieuses, promesses non gerees, rollback absent |
      | **Fuites de ressources** | Connexions non fermees, listeners non desenregistres, timers non nettoyes |
      | **Regressions** | Code supprime qui servait ailleurs, changement de comportement implicite |

      ### 2. Securite
      | Categorie | Points de controle |
      |-----------|-------------------|
      | **Injections** | SQL injection, XSS, command injection, template injection |
      | **Auth/Authz** | Middleware auth manquant, controle d'acces insuffisant, IDOR, escalade de privileges |
      | **Exposition de donnees** | Donnees sensibles dans les logs, reponses API trop verbeuses, secrets en clair |
      | **Dependances** | Packages avec CVE connues, versions non patchees |

      ### 3. Breaking changes
      - Signatures d'API modifiees/supprimees
      - Methodes publiques supprimees ou renommees
      - Types de retour modifies
      - Schema BDD : migrations destructives
      - Variables d'env ajoutees/supprimees

      ### 4. Tests manquants
      - Happy path non couvert
      - Edge cases non testes
      - Conditions d'erreur non verifiees
      - Valeurs frontieres absentes

      ## Regles
      - Etre factuel — citer le code exact (fichier:ligne)
      - Distinguer clairement bloquant vs non-bloquant
      - Evaluer honnetement les risques (pas de faux positifs alarmistes)
      - Adapter la profondeur au volume du diff
      - Valoriser les points forts du code

      Reponds UNIQUEMENT en JSON valide :
      {{
        "verdict": "approved|approved_with_reservations|corrections_required",
        "score": 85,
        "findings": [
          {{
            "severity": "critical|high|medium|low",
            "category": "bug|edge_case|race_condition|error_handling|regression",
            "file": "chemin/du/fichier",
            "line": 42,
            "description": "Description du probleme",
            "suggestion": "Suggestion de correction",
            "blocking": true
          }}
        ],
        "security_issues": [
          {{
            "severity": "critical|high|medium|low",
            "type": "injection|auth|data_exposure|dependency",
            "file": "chemin/du/fichier",
            "line": 42,
            "description": "Description",
            "remediation": "Correction suggeree",
            "blocking": true
          }}
        ],
        "breaking_changes": [
          {{
            "type": "api|method|type|database|config",
            "description": "Ce qui change",
            "impact": "Impact sur les consommateurs",
            "migration": "Etapes de migration"
          }}
        ],
        "missing_tests": [
          {{
            "file": "fichier a tester",
            "description": "Test a ecrire",
            "priority": "high|medium|low"
          }}
        ],
        "strengths": ["Point fort 1", "Point fort 2"],
        "summary": "Resume de la review code"
      }}

  mr-review-arch:
    command: /mr-review-arch
    runner: gemini
    description: "MR architecture review (independent model)"
    auto_advance: true
    next_on_pass: mr-review-quality
    next_on_fail: null
    pass_condition: null
    required_fields: [verdict, score, summary]
    timeout: 600
    runner_kwargs:
      allowed_tools: null
    prompt: |
      Tu es un **Architecte logiciel** senior et independant. Tu evalues les changements d'une Merge Request sous l'angle architectural.

      **Forge** : {forge_name}

      **Instructions additionnelles** :
      {instructions}

      **Donnees de la MR** :
      {step_output_mr-fetch}

      ## Ta mission

      Analyse le diff de la MR pour evaluer la conformite architecturale et la qualite structurelle des changements.

      ## Criteres d'evaluation

      ### 1. Conformite architecture
      - **Repository pattern** : les acces donnees passent-ils par des Repositories avec Interface ?
      - **DTOs** : les donnees sont-elles typees avec Spatie Laravel Data (pas de arrays bruts) ?
      - **Pinia stores** : les appels API passent-ils par des stores Composition API ?
      - **Zod validation** : les formulaires ont-ils une validation Zod ?
      - **Separation des couches** : Controllers → Services → Repositories, pas de logique metier dans les controllers

      ### 2. Couplage et cohesion
      - Dependances circulaires introduites ?
      - Modules trop couples ?
      - Responsabilites bien reparties (SRP) ?

      ### 3. Scalabilite
      - Requetes N+1 ?
      - Pagination manquante sur les listes ?
      - Index manquants sur les nouvelles colonnes ?
      - Cache utilise quand pertinent ?

      ### 4. Compatibilite
      - Migrations reversibles (down()) ?
      - Changements retro-compatibles ?
      - Impact sur les autres modules ?

      ### 5. Patterns et conventions
      - Nommage conforme aux conventions du projet ?
      - Structure des fichiers respectee ?
      - Patterns existants reutilises (pas de reinvention) ?

      ## Regles
      - Etre objectif et factuel
      - Citer les fichiers et lignes concernes
      - Distinguer violations critiques vs recommandations

      Reponds UNIQUEMENT en JSON valide :
      {{
        "verdict": "approved|approved_with_reservations|corrections_required",
        "score": 85,
        "architecture_compliance": {{
          "repository_pattern": {{"status": "pass|warn|fail", "details": "..."}},
          "dto_usage": {{"status": "pass|warn|fail", "details": "..."}},
          "pinia_stores": {{"status": "pass|warn|fail", "details": "..."}},
          "zod_validation": {{"status": "pass|warn|fail", "details": "..."}},
          "layer_separation": {{"status": "pass|warn|fail", "details": "..."}}
        }},
        "pattern_violations": [
          {{"severity": "critical|major|minor", "pattern": "nom du pattern", "file": "chemin", "description": "...", "suggestion": "..."}}
        ],
        "scalability_issues": [
          {{"type": "n_plus_1|pagination|index|cache", "file": "chemin", "description": "...", "suggestion": "..."}}
        ],
        "coupling_issues": [
          {{"modules": ["module_a", "module_b"], "description": "...", "suggestion": "..."}}
        ],
        "recommendations": [
          {{"priority": "high|medium|low", "description": "...", "rationale": "..."}}
        ],
        "strengths": ["Point fort 1", "Point fort 2"],
        "summary": "Resume de la review architecturale"
      }}

  mr-review-quality:
    command: /mr-review-quality
    runner: cursor
    description: "MR code quality review (Cursor tool)"
    auto_advance: true
    next_on_pass: mr-summary
    next_on_fail: null
    pass_condition: null
    required_fields: [verdict, score, summary]
    timeout: 600
    runner_kwargs:
      allowed_tools: null
    prompt: |
      Tu es un expert en **qualite de code** et bonnes pratiques de developpement.

      **Forge** : {forge_name}

      **Instructions additionnelles** :
      {instructions}

      **Donnees de la MR** :
      {step_output_mr-fetch}

      ## Ta mission

      Analyse le diff de la MR pour evaluer la qualite du code : lisibilite, maintenabilite, conventions et bonnes pratiques.

      ## Dimensions d'analyse

      ### 1. Nommage
      - Variables, fonctions, classes : noms explicites et coherents ?
      - Conventions respectees (camelCase JS/TS, snake_case PHP) ?
      - Pas d'abreviations ambigues ?

      ### 2. Complexite
      - Fonctions < 50 lignes ?
      - Complexite cyclomatique raisonnable ?
      - Niveaux d'imbrication < 4 ?
      - Logique conditionnelle simplifiable ?

      ### 3. DRY (Don't Repeat Yourself)
      - Code duplique entre fichiers ?
      - Logique copiee au lieu d'etre factorisee ?
      - Patterns repetes qui meritent un helper/composable ?

      ### 4. Lisibilite
      - Code auto-documentant ?
      - Commentaires pertinents (pas de noise) ?
      - Structure logique du code ?
      - Espacement et formatage coherents ?

      ### 5. Type safety
      - Types TypeScript stricts (pas de `any`) ?
      - Type hints PHP presents ?
      - Nullable gere correctement ?

      ### 6. Code smells
      - Fonctions avec trop de parametres (> 4) ?
      - God classes / god functions ?
      - Magic numbers / strings ?
      - Dead code / code commente ?
      - console.log / dd() / dump() oublies ?

      ## Regles
      - Etre constructif — proposer des ameliorations concretes
      - Citer fichier:ligne pour chaque issue
      - Prioriser par impact sur la maintenabilite

      Reponds UNIQUEMENT en JSON valide :
      {{
        "verdict": "approved|approved_with_reservations|corrections_required",
        "score": 85,
        "code_smells": [
          {{
            "type": "magic_number|dead_code|god_function|too_many_params|debug_left|commented_code",
            "file": "chemin/du/fichier",
            "line": 42,
            "description": "Description du probleme",
            "suggestion": "Correction suggeree"
          }}
        ],
        "complexity_issues": [
          {{
            "file": "chemin/du/fichier",
            "function": "nom_fonction",
            "issue": "trop_long|trop_imbrique|cyclomatique_eleve",
            "details": "..."
          }}
        ],
        "naming_issues": [
          {{
            "file": "chemin/du/fichier",
            "current": "nom actuel",
            "suggested": "nom suggere",
            "reason": "..."
          }}
        ],
        "dry_violations": [
          {{
            "files": ["fichier1", "fichier2"],
            "description": "Code duplique",
            "suggestion": "Factorisation proposee"
          }}
        ],
        "type_safety_issues": [
          {{
            "file": "chemin/du/fichier",
            "line": 42,
            "description": "any usage, missing type hint, etc."
          }}
        ],
        "improvements": [
          {{"description": "...", "priority": "high|medium|low", "effort": "low|medium|high"}}
        ],
        "strengths": ["Point fort 1", "Point fort 2"],
        "summary": "Resume de la review qualite"
      }}

  mr-summary:
    command: /mr-summary
    runner: claude
    description: "Consolidate reviews, optionally post to GitLab"
    auto_advance: false
    next_on_pass: null
    next_on_fail: null
    pass_condition: null
    required_fields: [overall_verdict, overall_score, summary]
    timeout: 600
    runner_kwargs:
      allowed_tools: null
    prompt: |
      Tu es un **Tech Lead** senior. Tu consolides les reviews d'une Merge Request.

      **Forge** : {forge_name}

      **Instructions additionnelles** :
      {instructions}

      **Donnees de la MR** :
      {step_output_mr-fetch}

      **Review code (Claude)** :
      {step_output_mr-review}

      **Review architecture (Gemini)** :
      {step_output_mr-review-arch}

      **Review qualite (Cursor)** :
      {step_output_mr-review-quality}

      **Review complete Lead Dev + Architect (Claude — /review-mr)** :
      {step_output_review-mr}

      ## Ta mission

      1. **Consolide** les 3 reviews en un rapport unifie
      2. **Genere** les release notes
      3. **Si demande explicitement** : publie le rapport sur la MR GitLab via `glab`

      ## Publication sur GitLab (OPTIONNELLE)

      **Ne publie sur GitLab QUE si les instructions additionnelles contiennent explicitement "gitlab", "publish", "post" ou "comment".**
      Si ce n'est pas le cas, genere uniquement le rapport JSON sans executer de commande `glab`. Mets `gitlab_comment_posted` a `false` et les compteurs inline a 0.

      Si la publication est demandee, suis les etapes ci-dessous :

      ## Etape 1 : Consolidation

      Fusionne les findings des 3 reviews :
      - Deduplique les issues identiques trouvees par plusieurs reviewers
      - Priorise par severite (critical > high > medium > low)
      - Distingue clairement : bloquant vs non-bloquant
      - Calcule un verdict global et un score moyen pondere

      ## Etape 2 : Release notes

      A partir du diff et des reviews, categorise les changements :
      - **Nouvelles fonctionnalites** (feat)
      - **Corrections de bugs** (fix)
      - **Ameliorations de performance** (perf)
      - **Breaking changes** (si identifies)
      - **Deprecations**

      ## Etape 3 : Publication sur GitLab (seulement si demandee)

      ### 3a. Commentaire general (resume de la review)

      Publie un commentaire de synthese sur la MR :

      ```bash
      glab mr note {mr_iid} --repo {mr_project} -m "$(cat <<'REVIEWEOF'
      ## Review automatique multi-agents

      | Section | Statut | Findings |
      |---------|--------|----------|
      | Code (bugs, securite) | [statut] | X problemes |
      | Architecture | [statut] | X violations |
      | Qualite code | [statut] | X issues |

      **Verdict global : [verdict] — Score : [score]/100**

      ### Findings bloquants
      [Liste des findings bloquants avec fichier:ligne]

      ### Findings non-bloquants
      [Liste des findings non-bloquants]

      ### Release notes
      [Release notes formatees]

      ### Points forts
      [Points forts identifies]

      ---
      *Review generee automatiquement par Mycel (Claude + Gemini + Cursor)*
      REVIEWEOF
      )"
      ```

      ### 3b. Commentaires inline (sur les lignes du diff)

      Pour chaque finding bloquant qui a un fichier et un numero de ligne, poste un commentaire inline sur le diff.

      D'abord, recupere les SHA necessaires :
      ```bash
      DIFF_REFS=$(glab api "projects/$(echo '{mr_project}' | sed 's/\//%2F/g')/merge_requests/{mr_iid}" 2>/dev/null | grep -o '"diff_refs":[^}}]*}}' | head -1)
      ```

      Puis pour chaque finding avec fichier:ligne :
      ```bash
      glab api --method POST "projects/$(echo '{mr_project}' | sed 's/\//%2F/g')/merge_requests/{mr_iid}/discussions" \
        -f "body=[emoji_severite] **[Severite]** — [Description du finding]

      **Suggestion :** [Suggestion de correction]

      ---
      *Review Mycel*" \
        -f "position[position_type]=text" \
        -f "position[base_sha]=[base_sha]" \
        -f "position[head_sha]=[head_sha]" \
        -f "position[start_sha]=[start_sha]" \
        -f "position[new_path]=[chemin/du/fichier]" \
        -f "position[new_line]=[numero_de_ligne]"
      ```

      **Regles pour les commentaires inline :**
      - Utilise `new_path` + `new_line` pour les lignes ajoutees ou modifiees
      - Le numero de ligne doit correspondre a une ligne visible dans le diff
      - Si un commentaire inline echoue (ligne hors diff, erreur API), ajoute le finding dans le commentaire general en fallback
      - Ne poste pas plus de 10 commentaires inline (les plus critiques en priorite)
      - A la fin, affiche un recap : "X commentaires inline publies, Y en commentaire general (fallback)"

      ## Gestion des erreurs de publication
      - Si `glab mr note` echoue, note l'erreur mais ne bloque pas
      - Si les commentaires inline echouent, ajoute-les au commentaire general
      - Le rapport doit quand meme etre genere en JSON

      ## IMPORTANT
      - Chaque finding bloquant doit avoir : fichier, ligne, description, suggestion
      - Le verdict est base sur : au moins 1 finding critique → corrections_required, uniquement medium/low → approved_with_reservations, aucun finding → approved

      Reponds UNIQUEMENT en JSON valide :
      {{
        "overall_verdict": "approved|approved_with_reservations|corrections_required",
        "overall_score": 85,
        "review_summary": {{
          "code_review": {{"verdict": "...", "score": 0, "findings_count": 0}},
          "arch_review": {{"verdict": "...", "score": 0, "findings_count": 0}},
          "quality_review": {{"verdict": "...", "score": 0, "findings_count": 0}}
        }},
        "consolidated_findings": {{
          "blocking": [
            {{"source": "code|arch|quality", "severity": "critical|high", "file": "...", "line": 0, "description": "...", "suggestion": "..."}}
          ],
          "non_blocking": [
            {{"source": "code|arch|quality", "severity": "medium|low", "file": "...", "description": "...", "suggestion": "..."}}
          ]
        }},
        "release_notes": {{
          "features": ["..."],
          "fixes": ["..."],
          "performance": ["..."],
          "breaking_changes": ["..."],
          "deprecations": ["..."]
        }},
        "strengths": ["..."],
        "gitlab_comment_posted": false,
        "inline_comments_posted": 0,
        "inline_comments_fallback": 0,
        "summary": "Resume global de la review"
      }}
