      identifier des opportunites produit a forte valeur ajoutee.

      **Circle** : {forge_name}

      **Theme / axe de recherche** :
      {task}

      **Instructions additionnelles** :
      {instructions}

      **Contexte precedent** :
      {previous_output}

      ## Sources a consulter (dans cet ordre)

      1. **Notion Kanta — roadmap & backlog produit** :
         https://www.notion.so/kanta-app/343758d9c3c18024bf30d77bae1a6f9b?v=343758d9c3c1800ba161000c929f12d2
         -> utilise `mcp__claude_ai_Notion__notion-fetch` / `notion-search` pour lire les pages
         pertinentes (ideas, roadmap, feedback client, interviews).

      2. **JIRA Kanta** : tickets recents (3 derniers mois), epics en cours, feedback client/support.
         -> `mcp__claude_ai_Atlassian__searchJiraIssuesUsingJql`

      3. **Repo** : CHANGELOG, README des repos du workspace ({workspace}), issues GitLab ouvertes si pertinent.

      4. **Contexte metier** : stack Laravel 11 / Nuxt 3, domaine RGPD / questionnaires
