# Arcane — Configuration des cercles d'invocation
# Chemins resolus depuis .env : WORKSPACE_FEATURE, WORKSPACE_BUG, WORKSPACE_SENTRY, etc.

# Noms de dossier des repos (identiques dans chaque workspace)
repos:
  api: kanta-api-v2
  front: kanta-front-v2
  ui: kanta-ui
  connector: kanta-connector-system
  database: kanta-database
  datawarehouse: kanta-datawarehouse
  infra: kanta-infra
  query-spray: kanta-query-spray
  basique-api: basique-api

# Groupes de workspace : chacun a son propre dossier de base (env var) et ses repos
workspace_groups:
  feature:
    base_env: WORKSPACE_FEATURE
    repos: [api, front, ui, connector, database, basique-api]
  bug:
    base_env: WORKSPACE_BUG
    repos: [api, front, ui, connector, database, basique-api]
  sentry:
    base_env: WORKSPACE_SENTRY
    repos: [api, basique-api]
  review:
    base_env: WORKSPACE_REVIEW
    repos: [api, front, ui, connector, database, basique-api]
  infra:
    base_env: WORKSPACE_FEATURE
    repos: [api, front, infra]

defaults:
  familiar: claude
  max_retries: 3
  timeout: 300

# Claude CLI options
claude:
  allowed_tools: "mcp__claude_ai_Atlassian__*,mcp__claude_ai_Notion__*,mcp__claude_ai_Figma__*,mcp__claude_ai_Sentry__*,mcp__claude_ai_Slack__*"
  permission_mode: "auto"

# Sentry monitoring
sentry_monitor:
  enabled: true
  interval: 3600
  auto_fix: false
  auto_fix_levels:
    - fatal

# Permissions par role Discord
permissions:
  default: all
  admin: all
  dev: [dev, bugfix, hotfix, review]
  ops: [sentry, sentry-comments, devsecops]
  product: [discovery]

# Cercles d'invocation
circles:
  dev:
    description: "Developpement de nouvelles fonctionnalites"
    familiar: claude
    channel: dev
    workspace_group: feature
    ritual:
      - plan
      - elaborate
      - arch-review
      - implement
      - tech-review
      - qa-scenario

  bugfix:
    description: "Resolution de bugs — diagnostic, plan, correction et review"
    familiar: claude
    channel: bugfix
    workspace_group: bug
    ritual:
      - diagnose
      - plan
      - implement
      - tech-review

  sentry:
    description: "Resolution d'erreurs Sentry — diagnostic et correction"
    familiar: claude
    channel: sentry
    workspace_group: sentry
    on_complete: review
    ritual:
      - diagnose
      - plan
      - implement
      - tech-review

  sentry-comments:
    description: "Traitement des commentaires Sentry — diagnostic, elaboration et correction"
    familiar: claude
    channel: sentry
    workspace_group: sentry
    ritual:
      - diagnose
      - elaborate
      - implement

  hotfix:
    description: "Correction urgente — diagnostic rapide et correction"
    familiar: claude
    channel: bugfix
    workspace_group: bug
    ritual:
      - diagnose
      - implement
      - tech-review

  devsecops:
    description: "Audit securite + dependances Kanta (CVE, secrets, OWASP) puis plan de remediation et correction"
    familiar: cursor
    channel: devsecops
    workspace_group: infra
    ritual:
      - audit
      - plan
      - implement
      - tech-review

  discovery:
    description: "Recherche de nouvelles features Kanta a partir de Notion / JIRA / repo"
    familiar: claude
    channel: discovery
    workspace_group: feature
    ritual:
      - research
      - elaborate
      - plan

  review:
    description: "Review multi-agents d'une Merge Request GitLab"
    familiar: claude
    channel: reviews
    workspace_group: review
    ritual:
      - mr-fetch
      - parallel:
        - mr-review
        - mr-review-arch
        - mr-review-quality
      - mr-summary
