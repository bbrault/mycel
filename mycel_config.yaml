# Dispatch — circle (workflow) configuration
# Paths from .env: WORKSPACE_FEATURE, WORKSPACE_BUG, WORKSPACE_REMEDIATION, etc.

# GitLab SSH configuration for dynamic workspace cloning
gitlab:
  ssh_base: "git@gitlab.com:kanta-app"
  docker_repo: "kanta-docker"

# Mapping: repo key → kanta-docker .env variable name
docker_env_mapping:
  api: KANTA_LAB_API_V2_PATH
  front: KANTA_LAB_FRONT_V2_PATH
  database: KANTA_DATABASE_PATH
  connector: KANTA_CONNECTOR_SYSTEM_PATH
  basique-api: KANTA_BASIQUE_CLIENT_PATH

# Repo folder names (same in each workspace)
repos:
  api: kanta-api-v2
  front: kanta-front-v2
  ui: kanta-ui
  connector: kanta-connector-system
  database: kanta-database
  datawarehouse: kanta-datawarehouse
  infra: kanta-infra
  query-spray: kanta-query-spray
  basique-api: basique-api

# Workspace groups: each has a base path (env var) and its repos
workspace_groups:
  feature:
    base_env: WORKSPACE_FEATURE
    repos: [api, front, ui, connector, database, basique-api]
  bug:
    base_env: WORKSPACE_BUG
    repos: [api, front, ui, connector, database, basique-api]
  # Security / incident / observability (Sentry + Aikido workflows) — one clone tree + git worktree per run
  remediation:
    base_env: WORKSPACE_REMEDIATION
    repos: [api, front, infra, connector, database, basique-api]
    git_worktree: true
  review:
    base_env: WORKSPACE_REVIEW
    repos: [api, front, ui, connector, database, basique-api]
  infra:
    base_env: WORKSPACE_FEATURE
    repos: [api, front, infra]

defaults:
  familiar: claude
  max_retries: 3
  timeout: 300

# Claude CLI options
claude:
  allowed_tools: "mcp__claude_ai_Atlassian__*,mcp__claude_ai_Notion__*,mcp__claude_ai_Figma__*,mcp__claude_ai_Sentry__*,mcp__claude_ai_Slack__*,mcp__claude_ai_Aikido__*"
  permission_mode: "auto"

# Conversational concierge (talk to Mycel in natural language via @mention)
# Phase 1: read-only tools only (mcp__mycel__*). See mycel_mcp_server.py.
agent:
  enabled: true
  timeout: 120
  allowed_tools: "mcp__mycel__*"
  permission_mode: auto
  mcp_config: mycel_mcp.json

# Sentry monitoring
sentry_monitor:
  enabled: true
  interval: 3600
  auto_fix: false
  auto_fix_levels:
    - fatal

# Aikido monitoring (via Aikido MCP — mirrors Sentry)
aikido_monitor:
  enabled: true
  interval: 3600
  auto_fix: false
  auto_fix_severities:
    - critical
  allowed_tools: "mcp__claude_ai_Aikido__*"

# Discord role permissions
permissions:
  default: all
  admin: all
  dev: [dev, bugfix, hotfix, review]
  ops: [sentry, sentry-comments, devsecops, aikido]
  product: [discovery]

# Forges (a forge is the execution environment for a ritual)
forges:
  dev:
    description: "New feature development"
    familiar: claude
    channel: dev
    workspace_group: feature
    dynamic_workspace: true
    ritual:
      - analyze
      - elaborate
      - plan
      - arch-review
      - implement
      - tech-review
      - qa-scenario

  bugfix:
    description: "Bug resolution — diagnose, plan, fix, and review"
    familiar: claude
    channel: bugfix
    workspace_group: bug
    ritual:
      - diagnose
      - plan
      - implement
      - tech-review

  sentry:
    description: "Sentry error resolution — JIRA tracking, fix, plan, arch-review, implement, review"
    familiar: claude
    channel: sentry
    workspace_group: remediation
    on_complete: review
    ritual:
      - jira-create
      - fix
      - plan
      - arch-review
      - implement
      - tech-review

  sentry-comments:
    description: "Sentry comment handling — diagnose, elaborate, and fix"
    familiar: claude
    channel: sentry
    workspace_group: remediation
    ritual:
      - diagnose
      - elaborate
      - implement

  hotfix:
    description: "Urgent hotfix — quick diagnose and fix"
    familiar: claude
    channel: bugfix
    workspace_group: bug
    ritual:
      - diagnose
      - implement
      - tech-review

  devsecops:
    description: "Security and dependency audit (CVE, secrets, OWASP) then remediation plan and fixes"
    familiar: cursor
    channel: devsecops
    workspace_group: infra
    ritual:
      - audit
      - plan
      - implement
      - tech-review

  aikido:
    description: "Aikido finding remediation — fix and review"
    familiar: claude
    channel: aikido
    workspace_group: remediation
    dynamic_workspace: true
    git_worktree: false
    ritual:
      - analyze
      - fix
      - implement
      - tech-review

  discovery:
    description: "Feature discovery from a Claap recording → elaborate → plan"
    familiar: claude
    channel: discovery
    workspace_group: feature
    ritual:
      - claap-discovery
      - elaborate
      - plan

  review:
    description: "Multi-agent merge request review (GitLab)"
    familiar: claude
    channel: reviews
    workspace_group: review
    ritual:
      - mr-fetch
      - parallel:
        - mr-review
        - mr-review-arch
        - mr-review-quality
        - review-mr
      - mr-summary
